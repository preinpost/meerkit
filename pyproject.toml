[project]
name = "meerkit"
version = "0.1.0"
description = "MR/PR 변경분을 pi 로 리뷰하고 인라인 코멘트로 게시하는 CI 이미지"
# 이미지의 python 과 같은 버전으로 묶는다. 로컬만 새 버전에서 돌면
# 여기서는 통과하고 CI 에서만 깨지는 문법이 들어온다.
# Dockerfile 의 PYTHON_VERSION 과 같이 옮긴다.
requires-python = ">=3.14,<3.15"
# 런타임 의존성은 없다. 게시는 stdlib urllib 로 직접 호출한다.
dependencies = []

[dependency-groups]
# 개발 전용이다. 이미지에는 파이썬 패키지를 하나도 깔지 않는다.
# 테스트는 unittest.TestCase 로 쓰고 pytest 는 실행기로만 쓴다 — VS Code 의
# 테스트 패널이 pytest 쪽을 훨씬 잘 다룬다.
dev = ["ruff>=0.14", "pytest>=8"]

[tool.uv]
# 평평한 스크립트 배치라 빌드할 패키지가 없다.
# 이미지 진입점이 /opt/meerkit/run-review.py 경로에 묶여 있어 그대로 둔다.
package = false

# 린트만 쓴다. ruff format 은 pi 호출 인자처럼 의미 단위로 묶어둔 줄을 풀어헤쳐
# 오히려 읽기 나빠지는 곳이 있어 강제하지 않는다.
[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["local-runner"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 테스트가 저장소 루트의 post_review·forge 를 임포트한다.
pythonpath = ["."]
